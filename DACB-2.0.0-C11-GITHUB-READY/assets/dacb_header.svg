      <stop offset="0" stop-color="#8b5cf6"/><stop offset="0.48" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1320" cy="105" r="210" fill="#22d3ee" opacity=".06"/>
