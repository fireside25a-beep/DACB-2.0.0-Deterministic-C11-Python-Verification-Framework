<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">DACB verification architecture</title>
  <desc id="desc">Published recurrence fans out into canonical C11 and independent Python implementations, then into external byte comparison and verification evidence.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1500" height="720" rx="30" fill="#08111f"/>
  <text x="72" y="78" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800">Verification architecture</text>
  <text x="72" y="116" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Shared specification, independent implementation paths, external comparison.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="485" y="160" width="530" height="90" rx="22" fill="#111c31" stroke="url(#g1)" stroke-width="3"/>
    <text x="750" y="198" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Published affine recurrence</text>
    <text x="750" y="228" text-anchor="middle" fill="#94a3b8" font-size="18">x[n+1] = (1664525 x[n] + 1013904223) mod 2^32</text>

    <path d="M750 250V286M750 286H398V320M750 286H1102V320" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="150" y="330" width="500" height="190" rx="24" fill="#10192c" stroke="#8b5cf6" stroke-width="2"/>
    <text x="190" y="376" fill="#ddd6fe" font-size="26" font-weight="800">Canonical C11</text>
    <text x="190" y="412" fill="#cbd5e1" font-size="19">• sequential chain</text><text x="190" y="442" fill="#cbd5e1" font-size="19">• affine exponentiation</text><text x="190" y="472" fill="#cbd5e1" font-size="19">• 2x2 matrix oracle</text><text x="190" y="502" fill="#cbd5e1" font-size="19">• inverse traversal</text>

    <rect x="850" y="330" width="500" height="190" rx="24" fill="#10192c" stroke="#22d3ee" stroke-width="2"/>
    <text x="890" y="376" fill="#cffafe" font-size="26" font-weight="800">Independent Python twin</text>
    <text x="890" y="412" fill="#cbd5e1" font-size="19">• separate source/runtime path</text><text x="890" y="442" fill="#cbd5e1" font-size="19">• own sequential evaluator</text><text x="890" y="472" fill="#cbd5e1" font-size="19">• own algebra + inverse checks</text><text x="890" y="502" fill="#cbd5e1" font-size="19">• own report serializer</text>

    <path d="M400 520V566H690M1100 520V566H810" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="590" y="550" width="320" height="74" rx="20" fill="#12251f" stroke="#34d399" stroke-width="2"/>
    <text x="750" y="580" text-anchor="middle" fill="#d1fae5" font-size="22" font-weight="800">External cmp</text>
    <text x="750" y="606" text-anchor="middle" fill="#a7f3d0" font-size="17">exact output-byte identity</text>

    <path d="M750 624V654" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="750" y="691" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Retained evidence + explicit claim boundaries</text>
  </g>
</svg>
