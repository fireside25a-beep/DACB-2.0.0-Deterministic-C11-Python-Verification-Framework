<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="440" viewBox="0 0 1500 440" role="img" aria-labelledby="title desc">
 <title id="title">DACB release verification flow</title><desc id="desc">Fourteen verification stages grouped by build, identity, exhaustive, safety and reproducibility gates.</desc>
 <defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
 <rect width="1500" height="440" rx="28" fill="#08111f"/>
 <text x="70" y="72" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">14-stage release gate</text>
 <text x="70" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">The retained verifier fails closed: any stage failure stops the release gate.</text>
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(70 155)"><rect width="250" height="175" rx="22" fill="#121a2f" stroke="#8b5cf6"/><text x="24" y="40" fill="#ddd6fe" font-size="20" font-weight="800">01 · BUILD</text><text x="24" y="78" fill="#cbd5e1" font-size="17">GCC strict C11</text><text x="24" y="106" fill="#cbd5e1" font-size="17">Clang strict C11</text><text x="24" y="134" fill="#cbd5e1" font-size="17">C + Python tests</text></g>
  <g transform="translate(345 155)"><rect width="250" height="175" rx="22" fill="#121a2f" stroke="#6d77e8"/><text x="24" y="40" fill="#e0e7ff" font-size="20" font-weight="800">02 · IDENTITY</text><text x="24" y="78" fill="#cbd5e1" font-size="17">GCC = Clang = Python</text><text x="24" y="106" fill="#cbd5e1" font-size="17">canonical report</text><text x="24" y="134" fill="#cbd5e1" font-size="17">5k + 1M CLI runs</text></g>
  <g transform="translate(620 155)"><rect width="250" height="175" rx="22" fill="#121a2f" stroke="#22d3ee"/><text x="24" y="40" fill="#cffafe" font-size="20" font-weight="800">03 · EXHAUSTIVE</text><text x="24" y="78" fill="#cbd5e1" font-size="17">cross-lang bits 2..11</text><text x="24" y="106" fill="#cbd5e1" font-size="17">C extended bits 2..12</text><text x="24" y="134" fill="#cbd5e1" font-size="17">exact summaries</text></g>
  <g transform="translate(895 155)"><rect width="250" height="175" rx="22" fill="#121a2f" stroke="#2ccdb5"/><text x="24" y="40" fill="#ccfbf1" font-size="20" font-weight="800">04 · SAFETY</text><text x="24" y="78" fill="#cbd5e1" font-size="17">ASan + UBSan</text><text x="24" y="106" fill="#cbd5e1" font-size="17">GCC -fanalyzer</text><text x="24" y="134" fill="#cbd5e1" font-size="17">invalid-input rejection</text></g>
  <g transform="translate(1170 155)"><rect width="260" height="175" rx="22" fill="#121a2f" stroke="#34d399"/><text x="24" y="40" fill="#d1fae5" font-size="20" font-weight="800">05 · REPEATABILITY</text><text x="24" y="78" fill="#cbd5e1" font-size="17">20 report repeats</text><text x="24" y="106" fill="#cbd5e1" font-size="17">source-tree hygiene</text><text x="24" y="134" fill="#cbd5e1" font-size="17">final PASS sentinel</text></g>
 </g>
 <rect x="70" y="365" width="1360" height="6" rx="3" fill="url(#accent)"/>
</svg>
